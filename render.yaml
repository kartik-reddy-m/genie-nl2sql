# Render Blueprint for the genie-nl2sql stack — ALL FREE TIER.
# Deploy: push to GitHub, then Render: New > Blueprint > pick the repo.
# Secrets marked `sync: false` must be filled in the Render dashboard.
#
# genie-service is a public web service (Render has no free private services),
# but it is protected by a shared INTERNAL_API_KEY that Render generates and
# injects into both backends via the `internal-auth` env group. Only
# conversation-service knows the key, so only it can call genie-service.
#
# NOTE: free web services sleep after ~15 min idle; the first request then takes
# ~30-60s to wake.

envVarGroups:
  - name: internal-auth
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true      # Render generates one value, shared by both backends

services:
  # --- Redis (managed Key Value) ---
  - type: keyvalue
    name: genie-redis
    plan: free
    ipAllowList: []              # internal only
    maxmemoryPolicy: noeviction

  # --- genie-service (public, but guarded by INTERNAL_API_KEY) ---
  - type: web
    name: genie-service
    runtime: docker
    rootDir: genie-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: internal-auth
      - key: DATABRICKS_HOST
        sync: false
      - key: DATABRICKS_TOKEN
        sync: false             # paste the ROTATED token
      - key: GENIE_SPACE_ID
        sync: false
      - key: GENIE_POLL_TIMEOUT
        value: "150"

  # --- conversation-service (public API, Google-auth protected) ---
  - type: web
    name: conversation-service
    runtime: docker
    rootDir: conversation-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: internal-auth
      - key: GENIE_SERVICE_URL
        sync: false             # set to genie-service PUBLIC url: https://genie-service-xxxx.onrender.com
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: genie-redis
          property: connectionString
      - key: CONVERSATION_REQUEST_TIMEOUT
        value: "180"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_ALLOWED_DOMAINS
        sync: false
      - key: GOOGLE_ALLOWED_EMAILS
        sync: false

  # --- ui-app (static site) ---
  - type: web
    name: ui-app
    runtime: static
    rootDir: ui-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_CONVERSATION_API
        sync: false             # set to conversation-service PUBLIC url: https://conversation-service-xxxx.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
